<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>로그인</title>
</head>
<body>
<h1>로그인</h1>

<div th:if="${param.signupSuccess}">
    <p style="color: green;">회원가입이 완료되었습니다. 로그인해주세요.</p>
</div>

<div th:if="${param.logout}">
    <p style="color: green;">로그아웃되었습니다.</p>
</div>

<div th:if="${errorMessage}">
    <p style="color: red;" th:text="${errorMessage}"></p>
</div>

<form th:action="@{/login}" th:object="${loginRequest}" method="post">
    <div>
        <label for="email">이메일</label>
        <input type="email" id="email" th:field="*{email}" placeholder="user1@test.com">
        <p style="color: red;" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></p>
    </div>

    <div>
        <label for="password">비밀번호</label>
        <input type="password" id="password" th:field="*{password}" placeholder="1234">
        <p style="color: red;" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></p>
    </div>

    <button type="submit">로그인</button>
</form>

<p>
    계정이 없다면 <a href="/signup">회원가입</a>
</p>

</body>
</html>
