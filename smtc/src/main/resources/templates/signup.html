<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>회원가입</title>
</head>
<body>
<h1>회원가입</h1>

<div th:if="${errorMessage}">
    <p style="color: red;" th:text="${errorMessage}"></p>
</div>

<form th:action="@{/signup}" th:object="${signupRequest}" method="post">
    <div>
        <label for="email">이메일</label>
        <input type="email" id="email" th:field="*{email}" placeholder="user1@test.com">
        <p style="color: red;" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></p>
    </div>

    <div>
        <label for="password">비밀번호</label>
        <input type="password" id="password" th:field="*{password}" placeholder="1234">
        <p style="color: red;" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></p>
    </div>

    <div>
        <label for="nickname">닉네임</label>
        <input type="text" id="nickname" th:field="*{nickname}" placeholder="윤서">
        <p style="color: red;" th:if="${#fields.hasErrors('nickname')}" th:errors="*{nickname}"></p>
    </div>

    <button type="submit">회원가입</button>
</form>

<p>
    이미 계정이 있다면 <a href="/login">로그인</a>
</p>

</body>
</html>
